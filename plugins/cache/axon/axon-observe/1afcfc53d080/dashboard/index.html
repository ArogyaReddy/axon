<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>axon activity</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%233757d6%22/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e6e5e0; --hover: #f1f0ec;
  --sel: #e9eefc; --accent: #3757d6; --ok: #1f7a4d; --fail: #c2362b; --warn: #a15c00; --tag: #eeede8;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace; --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151514; --panel: #1d1d1b; --ink: #ecebe6; --muted: #9a9993; --line: #2f2f2c; --hover: #262624;
    --sel: #232b45; --accent: #8ea4ff; --ok: #5cc58f; --fail: #ff7b6e; --warn: #e2a64b; --tag: #2a2a27; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); }
header { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .2px; }
header .meta { color: var(--muted); font-size: 12px; }
header input { margin-left: auto; width: min(320px, 40vw); padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--ink); font: inherit; }
main { display: grid; grid-template-columns: minmax(240px, 320px) minmax(0, 1fr); height: calc(100% - 55px); }
aside { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
.s { padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
.s:hover { background: var(--hover); }
.s.on { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
.s .f { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s .d { color: var(--muted); font-size: 12px; margin-top: 2px; }
.s .c { display: flex; gap: 10px; font-size: 12px; margin-top: 4px; color: var(--muted); font-variant-numeric: tabular-nums; }
.c .bad { color: var(--fail); } .c .deny { color: var(--warn); }
section { overflow-y: auto; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th { position: sticky; top: 0; background: var(--bg); text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
  color: var(--muted); font-weight: 600; padding: 9px 12px; border-bottom: 1px solid var(--line); }
td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: baseline; overflow-wrap: anywhere; }
td.t { width: 84px; color: var(--muted); font: 12px var(--mono); font-variant-numeric: tabular-nums; }
col.c1 { width: 92px; } col.c2 { width: 170px; } col.c3 { width: 110px; }
.b { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--tag); white-space: nowrap; }
.b.fail { background: color-mix(in srgb, var(--fail) 16%, transparent); color: var(--fail); }
.b.guard { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.b.session { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.b.agent { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.tg { font: 12.5px var(--mono); }
.empty { padding: 48px 24px; color: var(--muted); text-align: center; }
@media (max-width: 720px) {
  header { flex-wrap: wrap; gap: 4px 12px; padding: 12px 16px; }
  header input { margin-left: 0; width: 100%; }
  main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; }
  aside { max-height: 30vh; border-right: 0; border-bottom: 1px solid var(--line); }
  thead { display: none; }
  table, tbody { display: block; }
  tr { display: grid; grid-template-columns: auto auto 1fr; gap: 4px 10px; align-items: baseline; padding: 9px 16px; border-bottom: 1px solid var(--line); }
  td { padding: 0; border: 0; }
  td.t { width: auto; }
  td.dt { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<header><h1>axon activity</h1><span class="meta" id="meta">loading…</span><input id="q" type="search" placeholder="Filter: tool, file, command, rule"></header>
<main>
  <aside id="sessions"></aside>
  <section><table><colgroup><col class="c1"><col class="c2"><col class="c3"><col></colgroup>
    <thead><tr><th>Time</th><th>Event</th><th>Tool</th><th>Detail</th></tr></thead><tbody id="rows"></tbody></table>
    <div class="empty" id="empty" hidden>No events yet. Enable the axon-observe plugin and use Claude Code.</div></section>
</main>
<script>
let data = { sessions: [], events: [] }, current = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const when = ts => new Date(ts).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const clock = ts => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
function span(a, b) {
  const s = Math.round((Date.parse(b) - Date.parse(a)) / 1000);
  return s < 60 ? `${s} s` : s < 3600 ? `${Math.round(s / 60)} min` : `${Math.floor(s / 3600)} h ${Math.round((s % 3600) / 60)} min`;
}
function badge(e) {
  if (e.event === 'guard') return `<span class="b guard">${esc(e.hook)} ${esc(e.decision)}</span>`;
  const cls = e.outcome === 'fail' ? 'fail' : /^Session/.test(e.event) ? 'session' : /^Subagent/.test(e.event) ? 'agent' : '';
  return `<span class="b ${cls}">${esc(e.event)}</span>`;
}
function detail(e) {
  if (e.event === 'guard') return [e.rule, e.target].filter(Boolean).map(esc).join(' · ');
  if (e.prompt_chars !== undefined) return `${e.prompt_chars} characters`;
  return [e.target && `<span class="tg">${esc(e.target)}</span>`, e.detail && esc(e.detail), e.agent && esc(e.agent)].filter(Boolean).join(' · ');
}
function render() {
  const q = $('q').value.trim().toLowerCase();
  $('meta').textContent = `${plural(data.sessions.length, 'session')} · ${plural(data.events.length, 'event')} · last 2 days`;
  $('sessions').innerHTML = data.sessions.map(s => `<div class="s ${s.session === current ? 'on' : ''}" data-id="${esc(s.session)}">
    <div class="f">${esc(s.folder ?? 'unknown folder')}</div><div class="d">${when(s.first)} · ${span(s.first, s.last)}</div>
    <div class="c"><span>${plural(s.tools, 'tool call')}</span><span class="${s.failures ? 'bad' : ''}">${s.failures} failed</span><span class="${s.denies ? 'deny' : ''}">${s.denies} blocked</span></div></div>`).join('');
  const rows = data.events.filter(e => e.session === current)
    .filter(e => !q || JSON.stringify(e).toLowerCase().includes(q)).slice().reverse();
  $('rows').innerHTML = rows.map(e => `<tr><td class="t">${clock(e.ts)}</td><td>${badge(e)}</td><td>${esc(e.tool ?? '')}</td><td class="dt">${detail(e)}</td></tr>`).join('');
  $('empty').hidden = data.events.length > 0;
}
async function refresh() {
  try { data = await (await fetch('/api/events')).json(); } catch { return; }
  if (!current || !data.sessions.some(s => s.session === current)) current = data.sessions[0]?.session ?? null;
  render();
}
$('sessions').addEventListener('click', ev => { const el = ev.target.closest('.s'); if (el) { current = el.dataset.id; render(); } });
$('q').addEventListener('input', render);
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
